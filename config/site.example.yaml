# Copy to config/site.yaml and replace every <...> value for your installation.
# The single-sample wrapper overrides manifests.source and output_root per run.
manifests:
  source: config/manifests.example.txt
  vcf_key: outputs.snv_pass_vcf
  index_key: outputs.snv_pass_vcf_index
output_root: output/results
reference:
  assembly: GRCh38
  fasta: <path-to-grch38-fasta>
  fai: <path-to-grch38-fasta-index>
  dictionary: <path-to-grch38-sequence-dictionary>
vep:
  cache_directory: <path-to-vep-cache-root>
  cache_version: 115
  species: homo_sapiens
  assembly: GRCh38
  annotation_format: vep_cache
  forks: 4
  offline: true
  transcript_set: ensembl
  include_mane: true
  include_canonical: true
  include_tsl: true
  retain_all_transcript_consequences: true
spliceai:
  enabled: true
  annotation: <path-to-spliceai-grch38-annotation>
  # SpliceAI 1.3.1 accepts 0..4999; this is its largest supported window.
  max_distance: 4999
  masked: false
  candidate_threshold: 0.20
  review_threshold: 0.05
outputs:
  vep_vcf: true
  vep_tabular: true
temporary_directory: output/.tmp
resources:
  normalize: {threads: 2, mem_mb: 4096, runtime: 60}
  vep: {threads: 4, mem_mb: 32768, runtime: 480}
  spliceai: {threads: 1, mem_mb: 32768, runtime: 720}
  python: {threads: 1, mem_mb: 4096, runtime: 60}
  reporting: {threads: 1, mem_mb: 2048, runtime: 30}
logging:
  verbosity: INFO
