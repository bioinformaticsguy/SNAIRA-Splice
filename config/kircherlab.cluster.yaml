# Site configuration for the Kircherlab cluster. Use this through
# scripts/run_kircherlab_region_test.sh or scripts/run_snaira_splice.py; the
# single-sample wrapper replaces manifests.source and output_root per run.
manifests:
  source: config/manifests.example.txt
  vcf_key: outputs.snv_pass_vcf
  index_key: outputs.snv_pass_vcf_index
output_root: results
reference:
  assembly: GRCh38
  fasta: /data/humangen_kircherlab/Users/hassan/repos/VariantPiper/assets/reference/hg38.fa
  fai: /data/humangen_kircherlab/Users/hassan/repos/VariantPiper/assets/reference/hg38.fa.fai
  dictionary: /data/humangen_kircherlab/Users/hassan/resources/SNAIRA-Splice/reference/hg38.dict
vep:
  cache_directory: /data/humangen_kircherlab/Projects/VIPER-res/databases/vep
  cache_version: 115
  species: homo_sapiens
  assembly: GRCh38
  annotation_format: vep_cache
  forks: 4
  offline: true
  transcript_set: ensembl
  include_mane: true
  include_canonical: true
  include_tsl: true
  retain_all_transcript_consequences: true
spliceai:
  enabled: true
  annotation: /data/humangen_kircherlab/Users/hassan/resources/SNAIRA-Splice/spliceai/grch38.txt
  # SpliceAI 1.3.1 accepts 0..4999; this is its largest supported window.
  max_distance: 4999
  masked: false
  candidate_threshold: 0.20
  review_threshold: 0.05
outputs:
  vep_vcf: true
  vep_tabular: true
temporary_directory: /data/humangen_kircherlab/Users/hassan/snaira-splice-runs/tmp
resources:
  normalize: {threads: 2, mem_mb: 4096, runtime: 60}
  vep: {threads: 4, mem_mb: 32768, runtime: 480}
  spliceai: {threads: 1, mem_mb: 32768, runtime: 720}
  python: {threads: 1, mem_mb: 4096, runtime: 60}
  reporting: {threads: 1, mem_mb: 2048, runtime: 30}
logging:
  verbosity: INFO
