[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "snaira-splice"
version = "0.2.0.dev0"
description = "Standalone VEP and SpliceAI splice-variant analysis workflow"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["workflow/scripts"]
markers = ["integration: requires external VEP resources"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"workflow/scripts/generate_report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
